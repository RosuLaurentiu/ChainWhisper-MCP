name: Publish ChainWhisper Agent Tools

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact prerelease version from the package manifest
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-chainwhisper-agent-tools
  cancel-in-progress: false

jobs:
  publish-beta:
    name: Verify and publish beta
    runs-on: ubuntu-latest
    environment: npm-beta
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate requested version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$REQUESTED_VERSION" ]]; then
            echo "Requested version does not match package.json: $package_version" >&2
            exit 1
          fi
          if [[ "$package_version" != *-beta.* ]]; then
            echo "Only explicit beta prereleases may use this workflow." >&2
            exit 1
          fi
          if npm view "@chainwhisper/agent-tools@$package_version" version >/dev/null 2>&1; then
            echo "@chainwhisper/agent-tools@$package_version already exists and cannot be replaced." >&2
            exit 1
          fi

      - name: Verify source and COTI Mainnet runtime
        run: |
          npm run lint
          npm run build
          npm test
          npm run smoke
          npm run audit:dependencies
          npm run audit:runtime

      - name: Build and verify the release tarball
        shell: bash
        run: |
          mkdir release-artifacts
          node scripts/package-tarball-smoke.mjs --pack-destination release-artifacts
          sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS
          npm sbom --sbom-format cyclonedx > release-artifacts/sbom.cdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chainwhisper-agent-tools-${{ inputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable beta with provenance
        run: npm publish release-artifacts/*.tgz --access public --tag beta --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
