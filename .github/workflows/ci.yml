name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package / ${{ matrix.os-label }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: Ubuntu
            node: 20
          - os: ubuntu-latest
            os-label: Ubuntu
            node: 22
          - os: ubuntu-latest
            os-label: Ubuntu
            node: 24
          - os: windows-latest
            os-label: Windows
            node: 22
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke stdio servers
        run: npm run smoke

      - name: Audit, inspect, install, and smoke release tarball
        run: npm run verify:tarball
